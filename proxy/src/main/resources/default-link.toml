# Config version. Do not change this value manually.
config-version = "2.8"

# Network binding and transport
# The proxy listens on all interfaces at port 25590 by default.
bind = "0.0.0.0:25590"

# Netty transport mode. "auto" prefers epoll on Linux, kqueue on macOS,
# and falls back when the native transport is unavailable.
# Supported values: "auto", "epoll", "io_uring", "kqueue", "nio".
network-transport = "auto"

# Proxy identity shown in rewritten Minecraft brand messages.
proxy-name = "Link"

# Server list display
# MOTD shown in the multiplayer server list. MiniMessage format is required.
motd = "<#09add3>A Link Proxy Server"

# Maximum player count shown in the server list ping response.
# Link does not enforce this as a hard player cap.
show-max-players = 500

# Authentication and forwarding
# Kick clients whose ISP/AS differs from Mojang's authentication server result.
# This blocks some VPN/proxy connections, but should be treated as weak protection.
prevent-client-proxy-connections = false

# Link always forwards player IPs and UUIDs using modern forwarding.
# The file must exist or will be generated on first startup.
forwarding-secret-file = "forwarding.secret"

# Kick the currently connected player when a duplicate login is accepted.
kick-existing-players = false

# When disabled, player IP addresses are replaced with <ip address withheld> in logs.
enable-player-address-logging = true

[servers]
# Backend servers available to the proxy. Each key is the server name and each
# value is the backend address the proxy should connect to.
lobby = "127.0.0.1:30066"

# Server fallback order used on login and when a player is kicked from a backend.
try = [
    "lobby"
]

[forced-hosts]
# Optional hostname-based routing.
# Example:
# "lobby.example.com" = ["lobby"]

[advanced]
# Compress packets at or above this size in bytes.
# Use 0 to compress every packet or -1 to disable compression.
compression-threshold = 256

# Compression level from 0 to 9. Use -1 for the default Java zlib level.
compression-level = -1

# Minimum delay in milliseconds between connection attempts from the same IP.
# Use 0 to disable this limiter.
login-ratelimit = 3000

# Backend connection timeout in milliseconds.
connection-timeout = 5000

# Read timeout for client and backend connections in milliseconds.
read-timeout = 30000

# Accept HAProxy PROXY protocol headers from the load balancer.
# Enable only when all incoming traffic is sent by a trusted proxy.
haproxy-protocol = false

# Enable TCP Fast Open. Requires Linux support and OS-level configuration.
tcp-fast-open = false

# Enable BungeeCord plugin messaging channel compatibility.
bungee-plugin-message-channel = true

# Log server list ping requests. Disabled by default to avoid scanner noise.
# When enabled, these messages are emitted at DEBUG level.
show-ping-requests = false

# Try to move players to another backend after unexpected backend disconnects.
failover-on-unexpected-server-disconnect = true

# Advertise proxy commands to 1.13+ clients.
announce-proxy-commands = true

# Log command execution through the proxy.
log-command-executions = false

# Log player connects, server switches, and disconnects.
log-player-connections = true

# Accept players transferred from other hosts via the Minecraft 1.20.5 transfer packet.
accepts-transfers = false

# Enable SO_REUSEPORT for better accept scaling on supported Linux/macOS systems.
enable-reuse-port = false

# Minimum delay in milliseconds between proxy command submissions.
command-rate-limit = 50

# Forward commands to the backend when the proxy command rate limit is hit.
forward-commands-if-rate-limited = true

# Number of rate-limited commands allowed before kicking the player.
# Use 0 or lower to disable kicking for this limiter.
kick-after-rate-limited-commands = 0

# Minimum delay in milliseconds between tab-completion requests.
tab-complete-rate-limit = 10

# Number of rate-limited tab completions allowed before kicking the player.
# Use 0 or lower to disable kicking for this limiter.
kick-after-rate-limited-tab-completes = 0

[packet-limiter]
# Moving time window in seconds used to calculate average packet and byte rates.
interval = 7

# Maximum average packets per second from one client. Use -1 to disable this check.
packets-per-second = -1

# Maximum average compressed on-wire bytes per second. Use -1 to disable this check.
bytes-per-second = -1

# Maximum average decompressed bytes per second after packet inflation.
# This protects against compression bomb traffic. Use -1 to disable this check.
decompressed-bytes-per-second = 5242880

[dragonfly]
# Enable Dragonfly/Redis-backed multi-proxy state and protection.
enabled = false
# Passwordless local Dragonfly defaults to the normal Redis port.
address = "redis://127.0.0.1:6379"
password = ""
database = 0
key-prefix = "link"
# Share online player ownership across proxy instances.
sync-players = true
# Drop HAProxy v2 connections early when their source IP is listed below.
early-protection = true
blocked-ip-set = "blocked-ips"
vpn-ip-set = "vpn-ips"
# Cross-proxy login attempt limiter in milliseconds. Use 0 to disable.
shared-login-ratelimit = 3000

[query]
# Enable GameSpy 4 query responses.
enabled = false

# Query listener port. Used only when query support is enabled.
port = 25565

# Map name reported in query responses.
map = "Link"

# Include plugin information in query responses.
show-plugins = false
